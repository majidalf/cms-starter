# CI/CD for cms-starter (plan Section 6, decision D-1). web/ and studio/ are separate npm
# projects, so every job works inside one of them.
#
# CI/CD variables (Settings > CI/CD > Variables):
#   NEXT_PUBLIC_SANITY_PROJECT_ID, NEXT_PUBLIC_SANITY_DATASET, NEXT_PUBLIC_SITE_URL
#       build-time values for web/ (public, not secret). Do NOT mark them Protected:
#       merge request pipelines need them too, or the build stops at lib/site.ts.
#   SANITY_STUDIO_PROJECT_ID, SANITY_STUDIO_DATASET     studio/ build
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID          deploy - masked + protected
#   SANITY_AUTH_TOKEN                                    studio deploy - masked + protected
#
# E2E and Lighthouse visit seed URLs (tests/e2e/fixtures.ts, web/lighthouserc.json), so the
# dataset CI builds from must hold the seed (studio/seed/sample.ndjson). In a client project
# with real content, either point CI at a separate seeded dataset (e.g. `ci`) - only the
# `production` dataset is indexable, which is why Lighthouse skips the is-crawlable audit -
# or replace the seed URLs in both files with real ones. The deploy job always builds with
# the variables above, so set NEXT_PUBLIC_SANITY_DATASET per environment if they differ.

stages: [check, test, deploy]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: node:24-bookworm
  interruptible: true

.web:
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files: [web/package-lock.json]
    paths: [.npm/]
  before_script:
    - cd web
    - npm ci --no-audit --no-fund

.studio:
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files: [studio/package-lock.json]
    paths: [.npm/]
  before_script:
    - cd studio
    - npm ci --no-audit --no-fund

web:check:
  extends: .web
  stage: check
  script:
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm run test:coverage
    - npm run build
  artifacts:
    when: always
    expire_in: 1 week
    paths: [web/coverage/]

studio:check:
  extends: .studio
  stage: check
  script:
    - npm run schema:validate
    - npm run build

# Build the OpenNext Worker once. E2E and Lighthouse run against it in workerd (the
# runtime production uses), and the deploy job ships these same files - what was tested
# is what goes live.
web:build-worker:
  extends: .web
  stage: check
  script:
    - npm run cf:build
  artifacts:
    expire_in: 1 week
    paths: [web/.open-next/]

.web:browser:
  extends: .web
  # Keep the tag equal to the exact @playwright/test version in web/package.json - the image
  # ships the browsers for that one version.
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  stage: test
  needs:
    - job: web:build-worker
      artifacts: true

web:e2e:
  extends: .web:browser
  variables:
    E2E_SERVER: worker
  script:
    - npm run test:e2e
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths: [web/playwright-report/, web/test-results/]

web:lighthouse:
  extends: .web:browser
  script:
    - export CHROME_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
    - npm run lhci -- --collect.startServerCommand="npm run cf:preview:serve"
  artifacts:
    when: always
    expire_in: 1 week
    paths: [web/.lighthouseci/]

# Deploys only from the default branch, and only once the Cloudflare token is configured -
# so pushing the template before provisioning never fails the pipeline. Use an API token
# scoped to this account with Workers Scripts, Workers R2 Storage and D1 edit rights only.
web:deploy:
  extends: .web
  stage: deploy
  needs:
    - job: web:check
      artifacts: false
    - job: web:build-worker
      artifacts: true
    - job: web:e2e
      artifacts: false
    - job: web:lighthouse
      artifacts: false
  # Never cancel a deploy halfway because a newer commit arrived.
  interruptible: false
  resource_group: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN
  script:
    # Deploys the tested web:build-worker output; `npm run cf:deploy` would rebuild.
    - npx opennextjs-cloudflare deploy
  environment:
    name: production
    url: $NEXT_PUBLIC_SITE_URL

studio:deploy:
  extends: .studio
  stage: deploy
  needs: [studio:check]
  interruptible: false
  resource_group: studio
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SANITY_AUTH_TOKEN
      changes: [studio/**/*]
  script:
    - npx sanity deploy
