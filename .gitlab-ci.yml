# CI/CD for cms-starter (plan Section 6, decision D-1). web/ and studio/ are separate npm
# projects, so every job works inside one of them.
#
# CI/CD variables (Settings > CI/CD > Variables):
#   NEXT_PUBLIC_SANITY_PROJECT_ID, NEXT_PUBLIC_SANITY_DATASET, NEXT_PUBLIC_SITE_URL
#       build-time values for web/ (public, not secret)
#   SANITY_STUDIO_PROJECT_ID, SANITY_STUDIO_DATASET     studio/ build
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID          deploy - masked + protected
#   SANITY_AUTH_TOKEN                                    studio deploy - masked + protected
#
# E2E and Lighthouse run against the dataset above with the seed content imported
# (studio/seed/sample.ndjson) - tests/e2e/fixtures.ts lists the URLs they visit.

stages: [check, test, deploy]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: node:24-bookworm
  interruptible: true

.web:
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files: [web/package-lock.json]
    paths: [.npm/]
  before_script:
    - cd web
    - npm ci --no-audit --no-fund

.studio:
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files: [studio/package-lock.json]
    paths: [.npm/]
  before_script:
    - cd studio
    - npm ci --no-audit --no-fund

web:check:
  extends: .web
  stage: check
  script:
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm run test:coverage
    - npm run build
  artifacts:
    when: always
    expire_in: 1 week
    paths: [web/coverage/]

studio:check:
  extends: .studio
  stage: check
  script:
    - npm run schema:validate
    - npm run build

# Against `next start` for now. Plan Section 6 wants the OpenNext Worker preview
# (`opennextjs-cloudflare build` + `preview`) here; that needs workerd's install script,
# which waits on `npm approve-scripts` (STARTER_TEMPLATE_PLAN Section 13). Swap the build
# and start commands once that is approved.
.web:browser:
  extends: .web
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  stage: test
  needs: [web:check]

web:e2e:
  extends: .web:browser
  script:
    - npm run build
    - npm run test:e2e
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths: [web/playwright-report/, web/test-results/]

web:lighthouse:
  extends: .web:browser
  script:
    - npm run build
    - export CHROME_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
    - npm run lhci
  artifacts:
    when: always
    expire_in: 1 week
    paths: [web/.lighthouseci/]

# Deploys only from the default branch, and only once the Cloudflare token is configured -
# so pushing the template before provisioning never fails the pipeline.
web:deploy:
  extends: .web
  stage: deploy
  needs: [web:check, web:e2e, web:lighthouse]
  resource_group: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN
  script:
    - npm run cf:deploy
  environment:
    name: production
    url: $NEXT_PUBLIC_SITE_URL

studio:deploy:
  extends: .studio
  stage: deploy
  needs: [studio:check]
  resource_group: studio
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SANITY_AUTH_TOKEN
      changes: [studio/**/*]
  script:
    - npx sanity deploy
